name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Core tests without external dependencies
  core-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install Ginkgo
      run: |
        go get github.com/onsi/ginkgo/ginkgo@v1.16.2
        go get github.com/onsi/ginkgo/ginkgo/outline@v1.16.2

    - name: Build
      run: go build

    - name: Run core tests
      run: go run github.com/onsi/ginkgo/ginkgo -r --keepGoing --cover --trace -skipPackage=amqp,kafka,nats

    - name: Install gover
      run: go get github.com/modocache/gover

    - name: Generate coverage report
      run: go run github.com/modocache/gover ./ coverage.txt

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.txt
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Upload coverage to Coveralls
      if: success()
      run: |
        go get github.com/mattn/goveralls
        go run github.com/mattn/goveralls -coverprofile=coverage.txt -service=github || echo "Error uploading to Coveralls"
      env:
        COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}

  # NATS Streaming tests
  nats-tests:
    runs-on: ubuntu-latest
    services:
      nats-streaming:
        image: nats-streaming
        ports:
          - 4222:4222
        env:
          NATS_STREAMING_SERVER_OPTS: "-mc 0"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install Ginkgo
      run: |
        go get github.com/onsi/ginkgo/ginkgo@v1.16.2
        go get github.com/onsi/ginkgo/ginkgo/outline@v1.16.2

    - name: Wait for NATS
      run: |
        for i in {1..30}; do
          if timeout 5s bash -c 'exec 3<>/dev/tcp/localhost/4222 && echo -e "INFO\r\n" >&3 && head -1 <&3' >/dev/null 2>&1; then
            echo "NATS is ready!"
            break
          fi
          echo "Waiting for NATS to be ready... ($i/30)"
          sleep 2
        done

    - name: Set environment variables
      run: |
        echo "STAN_HOST=localhost" >> $GITHUB_ENV
        echo "NATS_HOST=localhost" >> $GITHUB_ENV

    - name: Run NATS tests
      run: go run github.com/onsi/ginkgo/ginkgo -r --keepGoing --cover --trace ./transit/nats

  # AMQP/RabbitMQ tests
  amqp-tests:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "timeout 5s bash -c '</dev/tcp/localhost/5672'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install Ginkgo
      run: |
        go get github.com/onsi/ginkgo/ginkgo@v1.16.2
        go get github.com/onsi/ginkgo/ginkgo/outline@v1.16.2

    - name: Set environment variables
      run: |
        echo "AMQP_HOST=guest:guest@localhost" >> $GITHUB_ENV

    - name: Run AMQP tests
      run: go run github.com/onsi/ginkgo/ginkgo -r --keepGoing --cover --trace ./transit/amqp

  # Kafka tests
  kafka-tests:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: spotify/kafka
        ports:
          - 9092:9092
        options: >-
          --health-cmd "timeout 10s bash -c '</dev/tcp/localhost/9092'"
          --health-interval 15s
          --health-timeout 15s
          --health-retries 15
        env:
          ADVERTISED_HOST: localhost
          ADVERTISED_PORT: 9092

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install kafkacat
      run: |
        sudo apt-get update
        sudo apt-get install -y kafkacat || sudo apt-get install -y kcat

    - name: Wait for Kafka
      run: |
        # Try kafkacat first, then kcat as fallback
        KAFKA_CMD="kafkacat"
        if ! command -v kafkacat &> /dev/null; then
          KAFKA_CMD="kcat"
        fi
        while ! $KAFKA_CMD -b localhost:9092 -L; do
          echo "Waiting for Kafka to be ready ..."
          sleep 2
        done

    - name: Install Ginkgo
      run: |
        go get github.com/onsi/ginkgo/ginkgo@v1.16.2
        go get github.com/onsi/ginkgo/ginkgo/outline@v1.16.2

    - name: Set environment variables
      run: |
        echo "KAFKA_HOST=localhost" >> $GITHUB_ENV

    - name: Run Kafka tests
      run: go run github.com/onsi/ginkgo/ginkgo -r --keepGoing --cover --trace ./transit/kafka

