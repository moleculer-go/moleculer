name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      nats-streaming:
        image: nats-streaming
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nc -z localhost 4222"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          NATS_STREAMING_SERVER_OPTS: "-mc 0"
      
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
      
      kafka:
        image: spotify/kafka
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics.sh --list --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        env:
          ADVERTISED_HOST: localhost
          ADVERTISED_PORT: 9092

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install kafkacat
      run: |
        sudo apt-get update
        sudo apt-get install -y kafkacat

    - name: Wait for Kafka
      run: |
        while ! kafkacat -b localhost:9092 -L; do
          echo "Waiting for Kafka to be ready..."
          sleep 2
        done

    - name: Set environment variables
      run: |
        echo "STAN_HOST=localhost" >> $GITHUB_ENV
        echo "NATS_HOST=localhost" >> $GITHUB_ENV
        echo "AMQP_HOST=guest:guest@localhost" >> $GITHUB_ENV
        echo "KAFKA_HOST=localhost" >> $GITHUB_ENV

    - name: Install Ginkgo
      run: |
        go get github.com/onsi/ginkgo/ginkgo@v1.16.2
        go get github.com/onsi/ginkgo/ginkgo/outline@v1.16.2

    - name: Build
      run: go build

    - name: Run tests
      run: go run github.com/onsi/ginkgo/ginkgo -r --keepGoing --cover --trace -skipPackage=amqp,kafka

    - name: Install gover
      run: go get github.com/modocache/gover

    - name: Generate coverage report
      run: go run github.com/modocache/gover ./ coverage.txt

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.txt
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Upload coverage to Coveralls
      if: success()
      run: |
        go get github.com/mattn/goveralls
        go run github.com/mattn/goveralls -coverprofile=coverage.txt -service=github || echo "Error uploading to Coveralls"
      env:
        COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}

    # Optional: Uncomment if you want to run Node.js compatibility tests
    # - name: Set up Node.js
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: '18'
    #
    # - name: Run Node.js compatibility tests
    #   run: go test github.com/moleculer-go/compatibility/moleculerjs
